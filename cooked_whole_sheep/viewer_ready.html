// 构建模型（正确应用每个元素的 pivot 旋转）
function buildScene(mode) {
    const group = new THREE.Group();
    for (const el of RAW.elements) {
        const from = el.from, to = el.to;
        const w = to[0]-from[0], h = to[1]-from[1], d = to[2]-from[2];
        const pivot = el.origin || [(from[0]+to[0])/2, (from[1]+to[1])/2, (from[2]+to[2])/2];
        const rot = el.rotation || [0,0,0];
        // 编辑器视图：Y 翻转显示（raw 为 Y 向下存储，Blockbench flip_y 编辑视图 = Y 向上）
        // mode 'editor' = 原样 (x, -y, z)，mode 'export' = (x, -y, z) 再绕 Z 转180°? 这里分别渲染两种候选
        let sx = 1, sy = -1, sz = 1, rx = rot[0], ry = rot[1], rz = rot[2];
        if (mode === 'raw') { sy = 1; }       // 原始存储（Y 向下）
        if (mode === 'export') { sx = -1; ry = -ry; }  // 导出/游戏当前 (X 镜像 + Y 翻转 + Y旋转取反)
        const pg = new THREE.Group();
        pg.position.set(pivot[0]*sx/16, pivot[1]*sy/16, pivot[2]/16);
        pg.rotation.order = 'XYZ';
        pg.rotation.set(rx*Math.PI/180, ry*Math.PI/180, rz*Math.PI/180);
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w/16, h/16, d/16), new THREE.MeshLambertMaterial({ color: 0xccaa77 }));
        mesh.position.set(((from[0]+to[0])/2 - pivot[0])*sx/16, ((from[1]+to[1])/2 - pivot[1])*sy/16, ((from[2]+to[2])/2 - pivot[2])/16);
        pg.add(mesh);
        group.add(pg);
    }
    return group;
}

// 场景
const scene = new THREE.Scene();
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const dir = new THREE.DirectionalLight(0xffffff, 1.2);
dir.position.set(30, 40, 30);
scene.add(dir);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 500);
camera.position.set(4, 3, 6.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.4, 1.2);

// 地面网格
const grid = new THREE.GridHelper(6, 6, 0x222222, 0x444444);
grid.position.y = 0;
scene.add(grid);

let current = null;
function show(mode) {
    if (current) { scene.remove(current); }
    if (mode === 1) current = buildScene('editor');
    else if (mode === 2) current = buildScene('raw');
    else current = buildScene('export');
    scene.add(current);
    const names = {1:'编辑器视图 Y上(猜测)', 2:'原始存储 Y下', 3:'导出=游戏当前'};
    document.getElementById('info').textContent = '视图: ' + names[mode] + '  (按1/2/3切换)';
}
show(1);
window.addEventListener('keydown', e => { if (e.key === '1') show(1); if (e.key === '2') show(2); if (e.key === '3') show(3); });
function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
animate();
</script>
